<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox — Triage Phishing Demo</title>
<!--
  Triage Link Warnings demo inbox.
  Every brand, person and address here is fictional. Links never navigate.
  Expected badges (see classify() in src/main/phishing/monitor.ts):
    https://triage-phishing-demo.invalid/... -> "Potential phishing"
    http://...                               -> "Unencrypted HTTP"
    https://example.com/...                  -> no badge
-->
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #e3e5e9; --text: #1d2330; --muted: #6b7280;
    --accent: #2f5bea; --accent-soft: #eaf0ff; --selected: #eef2fb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; }

  .topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; width: 200px; }
  .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3b6cf6, #7a4cf2); display: grid; place-items: center; color: white; font-size: 15px; }
  .search { flex: 1; max-width: 560px; height: 36px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; padding: 0 12px; color: var(--muted); }
  .me { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: #d9e2f6; color: #2a3f75; display: grid; place-items: center; font-weight: 600; font-size: 13px; }

  .shell { flex: 1; display: flex; min-height: 0; }
  .folders { width: 220px; flex: none; padding: 16px 12px; }
  .compose { width: 100%; height: 40px; border: 0; border-radius: 10px; background: var(--accent); color: white; font: inherit; font-weight: 600; margin-bottom: 16px; cursor: default; }
  .folder { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; color: #3a4252; }
  .folder.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .folder small { color: inherit; opacity: .8; }

  .list { width: 360px; flex: none; background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line); overflow-y: auto; }
  .list-head { padding: 14px 18px; font-weight: 650; font-size: 15px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .list-head span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .item { display: flex; gap: 12px; width: 100%; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .item:hover { background: #fafbfc; }
  .item.selected { background: var(--selected); box-shadow: inset 3px 0 var(--accent); }
  .item.unread .item-from, .item.unread .item-subject { font-weight: 650; }
  .avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; color: white; font-weight: 600; font-size: 14px; }
  .item-body { min-width: 0; flex: 1; }
  .item-row { display: flex; justify-content: space-between; gap: 8px; }
  .item-from { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-time { color: var(--muted); font-size: 12px; flex: none; }
  .item-subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-preview { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .reader { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 32px 48px; }
  .subject { font-size: 21px; font-weight: 650; margin: 0 0 16px; }
  .sender { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .sender-name { font-weight: 600; }
  .sender-addr, .sender-to { color: var(--muted); font-size: 13px; }
  .sender-time { margin-left: auto; color: var(--muted); font-size: 13px; }

  .mail { max-width: 600px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .mail-brand { padding: 18px 28px; color: white; font-weight: 700; font-size: 18px; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  .mail-brand i { font-style: normal; width: 26px; height: 26px; border-radius: 6px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 14px; }
  .mail-content { padding: 26px 28px 8px; }
  .mail-content h2 { font-size: 18px; margin: 0 0 12px; }
  .mail-content p { margin: 0 0 14px; color: #374151; }
  .details { width: 100%; border-collapse: collapse; margin: 6px 0 22px; font-size: 13px; background: #f8f9fb; border-radius: 8px; overflow: hidden; }
  .details td { padding: 9px 14px; border-bottom: 1px solid #eceef2; }
  .details td:first-child { color: var(--muted); width: 38%; }
  .details tr:last-child td { border-bottom: 0; }
  /* Extra space below each link leaves room for Triage's badge, which sits under the link. */
  .cta { display: inline-block; padding: 11px 22px; border-radius: 8px; color: white; font-weight: 600; text-decoration: none; margin: 4px 0 28px; }
  .text-link { color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; }
  .mail-foot { padding: 18px 28px 26px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .mail-foot .links { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; padding-bottom: 14px; }
  .mail-foot a { color: var(--muted); }
  .demo-note { max-width: 600px; margin-top: 14px; font-size: 12px; color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #1d2330; color: white; padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><div class="logo-mark">✉</div>Mailroom</div>
  <div class="search">Search mail</div>
  <div class="me">JR</div>
</header>

<div class="shell">
  <nav class="folders" aria-label="Folders">
    <button class="compose" type="button">Compose</button>
    <div class="folder active">Inbox <small id="unread-count"></small></div>
    <div class="folder">Starred</div>
    <div class="folder">Sent</div>
    <div class="folder">Drafts</div>
    <div class="folder">Spam</div>
  </nav>

  <section class="list" aria-label="Messages">
    <div class="list-head">Inbox <span>Demo mailbox</span></div>
    <div id="items"></div>
  </section>

  <main class="reader" id="reader" aria-live="polite"></main>
</div>

<div class="toast" id="toast">Demo link: navigation is disabled.</div>

<script>
const PHISH = 'https://triage-phishing-demo.invalid'

const emails = [
  {
    id: 'bank', unread: true, color: '#0f5c4a', time: '9:42 AM',
    from: 'Northfield Bank', addr: 'alerts@northfield-secure-mail.com',
    subject: 'Unusual sign-in attempt on your account',
    preview: 'We noticed a sign-in from a new device. If this wasn’t you, secure your account now.',
    body: `
      <div class="mail-brand" style="background:#0f5c4a"><i>N</i>Northfield Bank</div>
      <div class="mail-content">
        <h2>We noticed a new sign-in</h2>
        <p>Hi Jordan,</p>
        <p>Someone just signed in to your Northfield online banking account from a device we don’t recognize. For your protection, we’ve temporarily limited transfers until you confirm this activity.</p>
        <table class="details">
          <tr><td>Device</td><td>Windows 10 · Chrome</td></tr>
          <tr><td>Location</td><td>Bucharest, Romania (approx.)</td></tr>
          <tr><td>Time</td><td>Today, 9:38 AM</td></tr>
        </table>
        <p>Please review this activity within 24 hours to avoid a permanent hold on your account.</p>
        <a class="cta" style="background:#0f5c4a" href="${PHISH}/northfield/verify-identity">Review activity</a>
        <div class="actions">
          <a class="text-link" href="${PHISH}/northfield/lock-account">This wasn’t me — lock my account</a>
        </div>
      </div>
      <div class="mail-foot">
        Northfield Bank, Member FDIC. Please do not reply to this automated message.
        <div class="links">
          <a href="http://example.com/northfield/privacy">Privacy policy</a>
          <a href="https://example.com/northfield/help">Help center</a>
        </div>
      </div>`
  },
  {
    id: 'it', unread: true, color: '#5b3fd1', time: '8:15 AM',
    from: 'Halcyon IT Service Desk', addr: 'it-servicedesk@halcyon-systems.co',
    subject: 'Action required: your password expires in 24 hours',
    preview: 'Your network password is due to expire. Keep your current password to avoid losing access.',
    body: `
      <div class="mail-brand" style="background:#5b3fd1"><i>H</i>Halcyon Systems · IT</div>
      <div class="mail-content">
        <h2>Your password expires tomorrow</h2>
        <p>Hello Jordan,</p>
        <p>As part of our quarterly security policy, your Halcyon network password will expire in <strong>24 hours</strong>. After it expires you will lose access to email, VPN and shared drives.</p>
        <p>You can keep your current password by confirming it through the employee portal below.</p>
        <a class="cta" style="background:#5b3fd1" href="${PHISH}/halcyon/sso/keep-password">Keep my current password</a>
        <p>Questions? See the password policy or open a ticket with the Service Desk.</p>
        <div class="actions">
          <a class="text-link" href="http://example.com/halcyon/it/password-policy">Password policy</a>
          <a class="text-link" href="https://example.com/halcyon/servicedesk">Open a ticket</a>
        </div>
      </div>
      <div class="mail-foot">
        Halcyon Systems IT · Internal use only
        <div class="links"></div>
      </div>`
  },
  {
    id: 'parcel', unread: true, color: '#e07a12', time: 'Yesterday',
    from: 'ParcelPoint Delivery', addr: 'no-reply@parcelpoint-notify.net',
    subject: 'We couldn’t deliver your package',
    preview: 'Delivery attempt failed: incomplete address. Reschedule within 48 hours or it will be returned.',
    body: `
      <div class="mail-brand" style="background:#e07a12"><i>P</i>ParcelPoint</div>
      <div class="mail-content">
        <h2>Delivery attempt unsuccessful</h2>
        <p>We tried to deliver your package today but the address on file was incomplete.</p>
        <table class="details">
          <tr><td>Tracking number</td><td>PP 4471 0932 88</td></tr>
          <tr><td>Status</td><td>Held at local depot</td></tr>
          <tr><td>Redelivery fee</td><td>$1.99</td></tr>
        </table>
        <p>Reschedule within 48 hours or your package will be returned to the sender.</p>
        <a class="cta" style="background:#e07a12" href="${PHISH}/parcelpoint/reschedule">Reschedule delivery</a>
        <div class="actions">
          <a class="text-link" href="http://example.org/parcelpoint/track/PP4471093288">Track shipment</a>
        </div>
      </div>
      <div class="mail-foot">
        ParcelPoint Logistics · You are receiving this because a shipment was sent to you.
        <div class="links">
          <a href="https://example.org/parcelpoint/unsubscribe">Unsubscribe</a>
        </div>
      </div>`
  },
  {
    id: 'invoice', unread: false, color: '#1f7ae0', time: 'Yesterday',
    from: 'Brightwave Billing', addr: 'billing@brightwave-invoices.com',
    subject: 'Invoice INV-20481 is overdue',
    preview: 'Your payment of $1,284.00 is 3 days overdue. View the invoice to avoid service interruption.',
    body: `
      <div class="mail-brand" style="background:#1f7ae0"><i>B</i>Brightwave</div>
      <div class="mail-content">
        <h2>Payment overdue</h2>
        <p>Hi Jordan,</p>
        <p>We haven’t received payment for the invoice below. To avoid interruption to your Brightwave services, please settle the balance today.</p>
        <table class="details">
          <tr><td>Invoice</td><td>INV-20481</td></tr>
          <tr><td>Amount due</td><td>$1,284.00</td></tr>
          <tr><td>Due date</td><td>Nov 11, 2026</td></tr>
        </table>
        <a class="cta" style="background:#1f7ae0" href="${PHISH}/brightwave/invoice/INV-20481">View invoice</a>
        <div class="actions">
          <a class="text-link" href="http://example.net/brightwave/billing-faq">Billing FAQ</a>
        </div>
      </div>
      <div class="mail-foot">
        Brightwave Inc. · Accounts Receivable
        <div class="links">
          <a href="https://example.net/brightwave/terms">Terms of service</a>
        </div>
      </div>`
  },
  {
    id: 'lunch', unread: false, color: '#2e9e6a', time: 'Nov 12',
    from: 'Halcyon People Team', addr: 'people@halcyon-systems.co',
    subject: 'Reminder: Friday team lunch',
    preview: 'We’re doing tacos this Friday at noon. RSVP so we can get the order right.',
    body: `
      <div class="mail-brand" style="background:#2e9e6a"><i>H</i>Halcyon People Team</div>
      <div class="mail-content">
        <h2>Friday team lunch 🌮</h2>
        <p>Hi all,</p>
        <p>This Friday at noon we’re ordering tacos for the whole floor. Please RSVP by Thursday so we can get dietary needs right.</p>
        <div class="actions">
          <a class="text-link" href="https://example.com/halcyon/lunch-rsvp">RSVP</a>
          <a class="text-link" href="https://example.com/halcyon/lunch-menu">See the menu</a>
        </div>
        <p style="margin-top:28px">See you there!<br>— The People Team</p>
      </div>
      <div class="mail-foot">Halcyon Systems · Internal</div>`
  }
]

const itemsEl = document.getElementById('items')
const readerEl = document.getElementById('reader')
const toast = document.getElementById('toast')

function renderList(selected) {
  itemsEl.innerHTML = emails.map(e => `
    <button class="item${e.unread ? ' unread' : ''}${e.id === selected ? ' selected' : ''}" data-id="${e.id}" type="button">
      <div class="avatar" style="background:${e.color}">${e.from[0]}</div>
      <div class="item-body">
        <div class="item-row"><span class="item-from">${e.from}</span><span class="item-time">${e.time}</span></div>
        <div class="item-subject">${e.subject}</div>
        <div class="item-preview">${e.preview}</div>
      </div>
    </button>`).join('')
  const unread = emails.filter(e => e.unread).length
  document.getElementById('unread-count').textContent = unread || ''
}

function open(id) {
  const email = emails.find(e => e.id === id) ?? emails[0]
  email.unread = false
  renderList(email.id)
  readerEl.innerHTML = `
    <h1 class="subject">${email.subject}</h1>
    <div class="sender">
      <div class="avatar" style="background:${email.color}">${email.from[0]}</div>
      <div>
        <div class="sender-name">${email.from} <span class="sender-addr">&lt;${email.addr}&gt;</span></div>
        <div class="sender-to">to me</div>
      </div>
      <div class="sender-time">${email.time}</div>
    </div>
    <article class="mail">${email.body}</article>
    <p class="demo-note">Demo message for Triage Link Warnings. All companies and addresses are fictional and links don’t open.</p>`
  readerEl.scrollTop = 0
  if (location.hash.slice(1) !== email.id) history.replaceState(null, '', '#' + email.id)
}

itemsEl.addEventListener('click', event => {
  const item = event.target.closest('.item')
  if (item) open(item.dataset.id)
})

// Keep the demo self-contained: links exist for Triage to scan, never to follow.
let toastTimer
document.addEventListener('click', event => {
  if (!event.target.closest('a[href]')) return
  event.preventDefault()
  toast.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800)
})

window.addEventListener('hashchange', () => open(location.hash.slice(1)))
open(location.hash.slice(1))
</script>
</body>
</html>
